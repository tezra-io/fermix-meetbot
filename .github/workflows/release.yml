name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node's SEA cannot cross-compile — the artifact is always for the
          # host that built it, so each target gets its own runner. The target
          # strings match FermixCore.Meetings.SidecarInstaller.target/0 exactly;
          # a rename here makes the daemon download a 404.
          - target: macos-aarch64
            runner: macos-14
          - target: macos-x86_64
            runner: macos-13
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Gates
        run: |
          npm run lint
          npm run build
          npm test

      - name: Assert the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MANIFEST="$(node -p "require('./package.json').version")"
          if [ "v${MANIFEST}" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match package.json version v${MANIFEST}"
            exit 1
          fi
          echo "tag $REF_NAME matches package.json"

      - name: Package
        run: npm run package -- ${{ matrix.target }}

      - name: Smoke the binary over the wire
        run: npm run smoke -- "build/fermix-meetbot-${{ matrix.target }}"

      # macOS signing and notarization are gated on secrets and skip LOUDLY.
      # An unsigned binary still runs (the daemon downloads it with no
      # quarantine attribute), so the build must not fail — but a silent skip
      # is how an unsigned artifact ships without anyone noticing.
      - name: Sign (macOS)
        if: startsWith(matrix.runner, 'macos')
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BINARY="build/fermix-meetbot-${TARGET}"
          if [ -z "${CERTIFICATE_P12:-}" ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "::warning title=Unsigned artifact::MACOS_CERTIFICATE_P12 / MACOS_SIGN_IDENTITY are not set. Shipping ${BINARY} AD-HOC SIGNED ONLY."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # The SEA blob lives in a Mach-O section, so the signature must be
          # applied after injection — which is what the package step already did.
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Notarize (macOS)
        if: startsWith(matrix.runner, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BINARY="build/fermix-meetbot-${TARGET}"
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "::warning title=Un-notarized artifact::APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD are not set. Shipping ${BINARY} WITHOUT NOTARIZATION."
            exit 0
          fi
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          # A bare Mach-O executable cannot be stapled — only bundles, disk
          # images, and installer packages can carry a ticket on disk. Gatekeeper
          # validates this one online, which is why signing is the load-bearing
          # half here and notarization is the reputation half.
          echo "notarized (no staple: a standalone executable has nowhere to hold a ticket)"

      - name: Checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd build
          if command -v sha256sum > /dev/null; then
            sha256sum "fermix-meetbot-${TARGET}" > "fermix-meetbot-${TARGET}.sha256"
          else
            shasum -a 256 "fermix-meetbot-${TARGET}" > "fermix-meetbot-${TARGET}.sha256"
          fi
          cat "fermix-meetbot-${TARGET}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fermix-meetbot-${{ matrix.target }}
          path: |
            build/fermix-meetbot-${{ matrix.target }}
            build/fermix-meetbot-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksum manifest
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/fermix-meetbot-*
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            `fermix-meetbot` sidecar, wire protocol version 1.

            Paired release: fermix pins this tag and the per-target sha256 in
            `FermixCore.Meetings.SidecarInstaller`. Land that pin before any
            fermix build advertises the Google Meet notetaker.

            The operator machine still needs its Chromium:
            `npx playwright install chromium`.
